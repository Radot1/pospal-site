<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POSPal QR Menu</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="canonical" href="https://pospal.gr/qr-menu-demo.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1f1b16;
      --muted: #6f665c;
      --accent: #2f6b4f;
      --accent-strong: #1f4e3b;
      --accent-warm: #d78a3f;
      --paper: #fff7ec;
      --sand: #f4e8d6;
      --line: rgba(31, 27, 22, 0.12);
      --shadow: 0 10px 20px rgba(31, 27, 22, 0.1);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --max: 980px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overscroll-behavior: contain;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Manrope", "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      min-height: 100vh;
      line-height: 1.5;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(215, 138, 63, 0.18), transparent 45%),
        radial-gradient(circle at 80% 10%, rgba(47, 107, 79, 0.18), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(244, 232, 214, 0.75), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: var(--max);
      margin: 0 auto;
      padding: 10px 12px 32px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .menu-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      padding-bottom: 24px;
    }

    .hero {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 10px;
      flex-wrap: nowrap;
      border-bottom: 1px solid rgba(31, 27, 22, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0;
      flex: 1;
      min-width: 0;
    }

    h1 {
      font-family: "Fraunces", "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.15;
      margin: 0;
    }

    .menu-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0;
      border: none;
      background: transparent;
      flex-shrink: 0;
    }

    .category-nav {
      position: sticky;
      top: 6px;
      z-index: 5;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 6px;
      margin: 10px 0 8px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(31, 27, 22, 0.08);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }

    .category-nav::-webkit-scrollbar { display: none; }
    .category-nav { scrollbar-width: none; }

    .category-btn {
      border: 1px solid rgba(31, 27, 22, 0.12);
      border-radius: 999px;
      padding: 7px 10px;
      font-weight: 600;
      font-size: 11px;
      color: var(--muted);
      background: white;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      scroll-snap-align: start;
    }

    .category-btn.active {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
      color: white;
    }

    .menu-content {
      display: grid;
      gap: 14px;
    }

    .category {
      padding: 12px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(31, 27, 22, 0.08);
      box-shadow: var(--shadow);
    }

    .category h2 {
      font-family: "Fraunces", "Times New Roman", serif;
      font-size: 19px;
      margin: 0 0 6px;
    }

    .category-line {
      height: 2px;
      width: 46px;
      background: var(--accent-warm);
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .item-card {
      padding: 10px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(31, 27, 22, 0.08);
      background: white;
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }

    .item-card:last-child { margin-bottom: 0; }

    .item-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
    }

    .item-name {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .price-pill {
      background: var(--accent-strong);
      color: white;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      font-size: 12px;
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .tag--green {
      background: rgba(47, 107, 79, 0.12);
      color: var(--accent-strong);
      border-color: rgba(47, 107, 79, 0.2);
    }

    .tag--blue {
      background: rgba(31, 82, 144, 0.12);
      color: #1f5290;
      border-color: rgba(31, 82, 144, 0.2);
    }

    .tag--red {
      background: rgba(191, 63, 41, 0.12);
      color: #b03a27;
      border-color: rgba(191, 63, 41, 0.2);
    }

    .allergen-warning {
      background: rgba(191, 63, 41, 0.1);
      border: 1px solid rgba(191, 63, 41, 0.2);
      color: #9c2f1f;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
    }

    .options-btn {
      align-self: flex-start;
      border: none;
      background: var(--accent);
      color: white;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(47, 107, 79, 0.2);
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    .footer-brand a {
      color: var(--accent-strong);
      text-decoration: none;
      font-weight: 600;
    }

    .reveal {
      opacity: 0;
      transform: translateY(12px);
    }

    body.ready .reveal {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; }
      body.ready .reveal { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero reveal">
      <div class="brand">
        <h1 id="restaurantName">POSPal</h1>
      </div>
      <div class="menu-badge" id="menuBadge">Μενού</div>
    </header>

    <div class="menu-scroll" id="menuScroll">
      <nav id="categoryNav" class="category-nav reveal" aria-label="Categories"></nav>
      <main id="menuContent" class="menu-content"></main>

      <footer class="footer reveal">
        <p class="footer-brand">Powered by <a href="https://pospal.gr/" target="_blank" rel="noopener">POSPal</a></p>
        <p class="footer-support"><a href="mailto:support@pospal.gr">support@pospal.gr</a></p>
      </footer>
    </div>
  </div>

  <script>
    const EURO = "\u20ac";
    const DEMO_MENU = {
      "Καφέδες & Ροφήματα": [
        { "name": "Espresso μονός", "price": 2.2, "description": "Πλούσιος ελληνικός καφές με ένταση.", "dietary_tags": ["popular"] },
        { "name": "Espresso διπλός", "price": 2.9, "description": "Διπλή δόση για πιο δυνατό άρωμα." },
        { "name": "Cappuccino", "price": 3.4, "description": "Βελούδινος αφρός, ισορροπημένη ένταση.", "allergens": ["dairy"], "dietary_tags": ["popular"] },
        { "name": "Flat white", "price": 3.6, "description": "Απαλή κρέμα με έντονο espresso.", "allergens": ["dairy"] },
        { "name": "Latte", "price": 3.8, "description": "Κρεμώδης γεύση με απαλό espresso.", "allergens": ["dairy"] },
        { "name": "Americano", "price": 2.8 },
        { "name": "Φρέντο espresso", "price": 3.2 },
        { "name": "Φρέντο cappuccino", "price": 3.9, "allergens": ["dairy"] },
        { "name": "Ελληνικός", "price": 2.0 },
        { "name": "Τσάι Earl Grey", "price": 2.6, "dietary_tags": ["vegan", "gluten_free"] },
        { "name": "Ζεστή σοκολάτα", "price": 3.6, "allergens": ["dairy"] }
      ],
      "Brunch": [
        { "name": "Τοστ αβοκάντο με αυγό ποσέ", "price": 7.2, "allergens": ["gluten", "eggs"] },
        { "name": "Ομελέτα λαχανικών", "price": 6.8, "allergens": ["eggs", "dairy"], "dietary_tags": ["vegetarian"] },
        { "name": "Στραπατσάδα", "price": 6.4, "allergens": ["eggs", "dairy"], "dietary_tags": ["vegetarian"] },
        { "name": "Γιαούρτι με granola & μέλι", "price": 4.8, "allergens": ["dairy"] },
        { "name": "Pancakes με μέλι", "price": 5.4, "allergens": ["gluten", "eggs", "dairy"] }
      ],
      "Σνακ & Σάντουιτς": [
        { "name": "Τοστ γαλοπούλα-τυρί", "price": 3.6, "allergens": ["gluten", "dairy"] },
        { "name": "Σάντουιτς κοτόπουλο", "price": 6.2, "allergens": ["gluten"] },
        { "name": "Club sandwich", "price": 7.4, "allergens": ["gluten"] },
        { "name": "Bagel με τυρί κρέμα & γαλοπούλα", "price": 5.8, "allergens": ["gluten", "dairy"] },
        { "name": "Μπάρα δημητριακών", "price": 2.4 }
      ],
      "Κυρίως (Απλά πιάτα)": [
        { "name": "Σπαγγέτι ναπολιτάνα", "price": 8.6, "allergens": ["gluten"] },
        { "name": "Σπαγγέτι καρμπονάρα", "price": 10.2, "allergens": ["gluten", "eggs", "dairy"] },
        { "name": "Πέννες κοτόπουλο & κρέμα", "price": 10.6, "allergens": ["gluten", "dairy"] },
        { "name": "Ριζότο μανιταριών", "price": 9.8, "dietary_tags": ["vegetarian"] }
      ],
      "Μπύρες": [
        { "name": "Lager 330ml", "price": 3.4 },
        { "name": "Lager 500ml", "price": 4.6 },
        { "name": "Weiss 500ml", "price": 5.2 },
        { "name": "IPA 330ml", "price": 4.8 },
        { "name": "Χωρίς αλκοόλ 330ml", "price": 3.2 }
      ],
      "Αναψυκτικά & Χυμοί": [
        { "name": "Νερό εμφιαλωμένο 500ml", "price": 1.2 },
        { "name": "Ανθρακούχο νερό 500ml", "price": 1.6 },
        { "name": "Cola", "price": 2.4 },
        { "name": "Λεμονάδα σπιτική", "price": 3.0 },
        { "name": "Πορτοκαλάδα", "price": 2.6 },
        { "name": "Χυμός πορτοκάλι", "price": 3.4 },
        { "name": "Χυμός μήλο", "price": 2.8 },
        { "name": "Iced tea ροδάκινο", "price": 2.6 },
        { "name": "Τόνικ", "price": 2.4 },
        { "name": "Σόδα", "price": 2.0 }
      ]
    };

    const TAG_LABELS = {
      vegetarian: { label: "Χορτοφαγικό", className: "tag--green" },
      vegan: { label: "Βίγκαν", className: "tag--green" },
      gluten_free: { label: "Χωρίς Γλουτένη", className: "tag--blue" },
      dairy_free: { label: "Χωρίς Γαλακτοκομικά", className: "tag--blue" },
      spicy: { label: "Πικάντικο", className: "tag--red" },
      popular: { label: "Δημοφιλές", className: "tag--green" }
    };

    const ALLERGEN_LABELS = {
      nuts: { label: "Ξηροί καρποί" },
      dairy: { label: "Γαλακτοκομικά" },
      gluten: { label: "Γλουτένη" },
      seafood: { label: "Θαλασσινά" },
      eggs: { label: "Αβγά" },
      soy: { label: "Σόγια" }
    };

    const dom = {
      restaurantName: document.getElementById("restaurantName"),
      menuBadge: document.getElementById("menuBadge"),
      categoryNav: document.getElementById("categoryNav"),
      menuContent: document.getElementById("menuContent"),
      menuScroll: document.getElementById("menuScroll")
    };

    function formatCategoryLabel(label) {
      if (!label) return "";
      return label.replace(/^\d+\./, "").replace(/_/g, " ").trim();
    }

    function renderCategoryNav(categories) {
      dom.categoryNav.innerHTML = "";
      if (categories.length <= 1) {
        dom.categoryNav.style.display = "none";
        return;
      }
      dom.categoryNav.style.display = "flex";
      categories.forEach((category, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "category-btn";
        btn.textContent = formatCategoryLabel(category);
        btn.dataset.category = category;
        if (index === 0) btn.classList.add("active");
        btn.addEventListener("click", () => scrollToCategory(category));
        dom.categoryNav.appendChild(btn);
      });
    }

    function scrollToCategory(category) {
      const target = document.querySelector(`[data-category-section="${category}"]`);
      if (!target) return;
      if (!dom.menuScroll) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      const containerRect = dom.menuScroll.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const offset = targetRect.top - containerRect.top + dom.menuScroll.scrollTop - 12;
      dom.menuScroll.scrollTo({ top: offset, behavior: "smooth" });
    }

    function renderItems(menu) {
      dom.menuContent.innerHTML = "";
      const fragment = document.createDocumentFragment();
      const categories = Object.keys(menu || {});
      renderCategoryNav(categories);

      categories.forEach((category, catIndex) => {
        const section = document.createElement("section");
        section.className = "category reveal";
        section.dataset.categorySection = category;
        section.style.transitionDelay = `${catIndex * 50}ms`;

        const heading = document.createElement("h2");
        heading.textContent = formatCategoryLabel(category);
        const line = document.createElement("div");
        line.className = "category-line";
        section.appendChild(heading);
        section.appendChild(line);

        (menu[category] || []).forEach(item => {
          const card = document.createElement("article");
          card.className = "item-card";

          const header = document.createElement("div");
          header.className = "item-header";

          const name = document.createElement("h3");
          name.className = "item-name";
          name.textContent = item.name || "";

          const price = document.createElement("div");
          price.className = "price-pill";
          price.textContent = `${EURO}${Number(item.price || 0).toFixed(2)}`;

          header.appendChild(name);
          header.appendChild(price);
          card.appendChild(header);

          if (item.description) {
            const description = document.createElement("p");
            description.className = "description";
            description.textContent = item.description;
            card.appendChild(description);
          }

          const metaRow = document.createElement("div");
          metaRow.className = "meta-row";

          const tags = Array.isArray(item.dietary_tags) ? item.dietary_tags : [];
          const tagOrder = ["spicy", "vegan", "vegetarian", "gluten_free", "dairy_free", "popular"];
          tagOrder.forEach(tag => {
            if (!tags.includes(tag)) return;
            const tagData = TAG_LABELS[tag];
            if (!tagData) return;
            const chip = document.createElement("span");
            chip.className = `tag ${tagData.className}`;
            chip.textContent = tagData.label;
            metaRow.appendChild(chip);
          });

          if (metaRow.children.length) {
            card.appendChild(metaRow);
          }

          const allergens = Array.isArray(item.allergens) ? item.allergens : [];
          if (allergens.length) {
            const allergen = document.createElement("div");
            allergen.className = "allergen-warning";
            const allergenText = allergens
              .map(name => (ALLERGEN_LABELS[name] ? ALLERGEN_LABELS[name].label : name))
              .join(", ");
            allergen.textContent = `Περιέχει: ${allergenText}`;
            card.appendChild(allergen);
          }

          section.appendChild(card);
        });

        fragment.appendChild(section);
      });

      dom.menuContent.appendChild(fragment);
      requestAnimationFrame(() => document.body.classList.add("ready"));
      bindScrollSpy();
    }

    function bindScrollSpy() {
      const sections = Array.from(document.querySelectorAll("[data-category-section]"));
      if (!sections.length) return;
      const buttons = Array.from(dom.categoryNav.querySelectorAll(".category-btn"));
      if (!buttons.length) return;
      let activeCategory = "";

      function updateActive() {
        const offset = 120;
        const scrollTop = dom.menuScroll ? dom.menuScroll.scrollTop : window.scrollY;
        const scrollPosition = scrollTop + offset;
        const containerRect = dom.menuScroll ? dom.menuScroll.getBoundingClientRect() : null;
        let active = sections[0].dataset.categorySection;
        sections.forEach(section => {
          const sectionTop = containerRect
            ? section.getBoundingClientRect().top - containerRect.top + scrollTop
            : section.offsetTop;
          if (sectionTop <= scrollPosition) {
            active = section.dataset.categorySection;
          }
        });

        if (active === activeCategory) return;
        activeCategory = active;
        buttons.forEach(btn => {
          const isActive = btn.dataset.category === active;
          btn.classList.toggle("active", isActive);
        });
      }

      if (dom.menuScroll) {
        dom.menuScroll.removeEventListener("scroll", updateActive);
        dom.menuScroll.addEventListener("scroll", updateActive, { passive: true });
      } else {
        window.removeEventListener("scroll", updateActive);
        window.addEventListener("scroll", updateActive, { passive: true });
      }
      updateActive();
    }

    renderItems(DEMO_MENU);
  </script>
</body>
</html>
