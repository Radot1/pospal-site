<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
  <title>Από το τραπέζι στην κουζίνα</title>
  <desc>Εικονογράφηση της διαδρομής μιας παραγγελίας: τραπέζι, κινητό και δελτίο στην κουζίνα. Δεν απεικονίζει την οθόνη της εφαρμογής.</desc>
  <!-- Editable vector artwork. Palette: paper, forest, sage, warm orange. -->
