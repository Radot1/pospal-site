    <rect x="207" y="348" width="43" height="32" rx="5" fill="#173C2B"/>
    <text x="228" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#FFFFFF">7</text>
  </g>
  <!-- Schematic order on a phone; intentionally not a product screenshot. -->
  <g id="phone" transform="rotate(-5 589 296)">
    <rect x="499" y="122" width="190" height="359" rx="33" fill="#CDD6C9"/>
    <rect x="493" y="112" width="190" height="359" rx="33" fill="#173C2B"/>
    <rect x="505" y="125" width="166" height="330" rx="22" fill="#FFFFFF"/>
