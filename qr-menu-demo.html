<!doctype html>
<html lang="el">
<head>
    <script src="/static/js/ga-consent.js"></script>
<script defer src="/static/js/ga-events.js"></script>
  <meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POSPal Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --bg-soft: #f1f5f9;
      --surface: #ffffff;
      --surface-elevated: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --muted-2: #94a3b8;
      --line: #e5e7eb;
      --line-strong: #d1d5db;
      --brand: #16a34a;
      --brand-strong: #15803d;
      --brand-soft: #f0fdf4;
      --info: #2563eb;
      --info-soft: #eff6ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --warning: #d97706;
      --warning-soft: #fff7ed;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --max: 980px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    button, input, select, textarea { font: inherit; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, #f8fafc 0%, #f8fafc 55%, #f1f5f9 100%);
      min-height: 100vh;
      line-height: 1.45;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 18% -4%, rgba(37, 99, 235, 0.07), transparent 40%),
        radial-gradient(circle at 82% 0%, rgba(22, 163, 74, 0.07), transparent 42%);
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: var(--max);
      margin: 0 auto;
      padding: 14px 12px 40px;
    }

    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      flex-wrap: nowrap;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-sm);
    }

    .brand {
      display: flex;
      align-items: flex-start;
      gap: 0;
      flex: 1;
      min-width: 0;
    }

    .brand-stack {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    h1 {
      font-size: clamp(20px, 5vw, 24px);
      line-height: 1.12;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    #restaurantName {
      text-transform: none;
      overflow-wrap: anywhere;
    }

    .hero-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .menu-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(22, 163, 74, 0.2);
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand-strong);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .category-nav {
      position: sticky;
      top: 8px;
      z-index: 10;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px;
      margin: 12px 0 10px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: var(--radius-lg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }

    .category-nav::-webkit-scrollbar { display: none; }
    .category-nav { scrollbar-width: none; }

    .category-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      font-weight: 600;
      font-size: 12px;
      line-height: 1;
      color: var(--muted);
      background: var(--surface);
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      scroll-snap-align: start;
    }

    .category-btn:hover {
      border-color: #cbd5e1;
      background: var(--bg-soft);
      color: #374151;
    }

    .category-btn.active {
      background: #111827;
      border-color: #111827;
      color: white;
      box-shadow: 0 6px 14px rgba(17, 24, 39, 0.15);
    }

    .category-btn:focus-visible {
      outline: 2px solid #86efac;
      outline-offset: 2px;
    }

    .menu-content {
      display: grid;
      gap: 16px;
    }

    .category {
      padding: 14px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      scroll-margin-top: 84px;
    }

    .category h2 {
      font-size: clamp(18px, 2.2vw, 20px);
      line-height: 1.2;
      margin: 0 0 8px;
      font-weight: 700;
      color: var(--ink);
    }

    .category-line {
      height: 3px;
      width: 42px;
      background: linear-gradient(90deg, var(--brand) 0%, #22c55e 100%);
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .item-card {
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: var(--surface-elevated);
      display: grid;
      gap: 10px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
    }

    .item-card:last-child { margin-bottom: 0; }

    .item-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .item-name {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--ink);
      flex: 1;
      min-width: 0;
    }

    .price-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      background: var(--brand-soft);
      color: var(--brand-strong);
      border: 1px solid rgba(22, 163, 74, 0.2);
      font-weight: 800;
      padding: 0 10px;
      border-radius: 999px;
      white-space: nowrap;
      font-size: 13px;
      letter-spacing: -0.01em;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      font-size: 12px;
      font-weight: 600;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--bg-soft);
      color: #475569;
      border: 1px solid var(--line);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      letter-spacing: -0.01em;
    }

    .tag--green {
      background: var(--brand-soft);
      color: var(--brand-strong);
      border-color: rgba(22, 163, 74, 0.2);
    }

    .tag--blue {
      background: var(--info-soft);
      color: var(--info);
      border-color: rgba(37, 99, 235, 0.2);
    }

    .tag--red {
      background: var(--warning-soft);
      color: var(--warning);
      border-color: rgba(217, 119, 6, 0.2);
    }

    .allergen-warning {
      position: relative;
      background: var(--danger-soft);
      border: 1px solid rgba(220, 38, 38, 0.16);
      color: #991b1b;
      padding: 8px 10px 8px 30px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.35;
    }

    .allergen-warning::before {
      content: "!";
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.2);
      color: var(--danger);
      font-size: 10px;
      font-weight: 800;
      line-height: 12px;
      text-align: center;
    }

    .options-btn {
      align-self: flex-start;
      min-height: 38px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }

    .options-btn:hover {
      background: var(--bg-soft);
      border-color: #cbd5e1;
    }

    .options-btn:focus-visible {
      outline: 2px solid #86efac;
      outline-offset: 2px;
    }

    .footer {
      margin-top: 22px;
      padding: 12px 8px 4px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .footer p {
      margin: 0;
    }

    .footer p + p {
      margin-top: 6px;
    }

    .footer-brand a {
      color: var(--brand-strong);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-brand a:hover {
      text-decoration: underline;
    }

    .footer-brand a:focus-visible {
      outline: 2px solid #86efac;
      outline-offset: 2px;
      border-radius: 4px;
    }

    .status-message {
      margin: 4px 0 0;
      padding: 14px;
      text-align: left;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-sm);
    }

    .status-message:empty {
      display: none;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 12px max(12px, env(safe-area-inset-bottom, 0px));
      z-index: 20;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      width: 100%;
      max-width: 100%;
      max-height: min(82vh, 640px);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: 18px 18px 0 0;
      border: 1px solid var(--line);
      border-bottom: none;
      padding: 14px 14px 12px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.22);
    }

    .modal::before {
      content: "";
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: #cbd5e1;
      margin: 0 auto 10px;
      flex-shrink: 0;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 700;
      color: var(--ink);
    }

    .modal-body {
      overflow-y: auto;
      padding-right: 2px;
    }

    .modal-close {
      border: 1px solid var(--line);
      background: var(--bg-soft);
      color: var(--ink);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .modal-close:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }

    .modal-close:focus-visible {
      outline: 2px solid #86efac;
      outline-offset: 2px;
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.35;
    }

    .option-row:last-child { border-bottom: none; }

    .option-row > :first-child {
      color: var(--ink);
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .option-price {
      font-weight: 700;
      color: var(--brand-strong);
      white-space: nowrap;
    }

    .option-price.negative { color: var(--danger); }

    .reveal {
      opacity: 0;
      transform: translateY(12px);
    }

    body.ready .reveal {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    @media (min-width: 480px) {
      .shell {
        padding: 16px 14px 44px;
      }

      .hero {
        padding: 16px;
      }

      .category-btn {
        min-height: 42px;
        padding: 0 14px;
      }

      .item-card {
        padding: 13px;
      }

      .price-pill {
        min-height: 34px;
        font-size: 14px;
      }
    }

    @media (min-width: 768px) {
      .shell {
        padding: 20px 16px 56px;
      }

      .hero {
        align-items: center;
        gap: 16px;
        padding: 18px;
      }

      h1 {
        font-size: clamp(24px, 2.8vw, 28px);
      }

      .hero-note {
        font-size: 13px;
      }

      .menu-badge {
        min-height: 32px;
        padding: 0 12px;
      }

      .category-nav {
        top: 10px;
        gap: 10px;
      }

      .menu-content {
        gap: 18px;
      }

      .category {
        padding: 16px;
        scroll-margin-top: 92px;
      }

      .category-line {
        width: 48px;
      }

      .modal-overlay {
        align-items: center;
        padding: 20px;
      }

      .modal {
        max-width: 420px;
        border-radius: var(--radius-lg);
        border-bottom: 1px solid var(--line);
        padding: 16px;
      }

      .modal::before {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .category-btn,
      .options-btn,
      .modal-close {
        transition: none;
      }
      .reveal { opacity: 1; transform: none; }
      body.ready .reveal { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero reveal">
      <div class="brand">
        <div class="brand-stack">
          <h1 id="restaurantName">Menu</h1>
          <p class="hero-note">Ρωτήστε το προσωπικό για αλλεργίες ή ειδικές προτιμήσεις</p>
        </div>
      </div>
      <div class="menu-badge" id="menuBadge"></div>
    </header>

    <nav id="categoryNav" class="category-nav reveal" aria-label="Categories"></nav>
    <div id="statusMessage" class="status-message"></div>
    <main id="menuContent" class="menu-content"></main>

    <footer class="footer reveal">
      <p id="footerNotice"></p>
      <p class="footer-brand">Powered by <a href="https://pospal.gr/" target="_blank" rel="noopener">POSPal</a></p>
      <p class="footer-brand"><a href="/privacy.html">Πολιτική απορρήτου</a></p>
    </footer>
  </div>

  <div id="optionsModal" class="modal-overlay" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <h3 id="optionsTitle"></h3>
        <button type="button" class="modal-close" id="optionsClose" aria-label="Close">×</button>
      </div>
      <div id="optionsList" class="modal-body"></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://menus-api.bzoumboulis.workers.dev";
    const EURO = "\u20ac";

    const COPY = {
      menuTitle: "\u039c\u03b5\u03bd\u03bf\u03cd",
      optionsLabel: "\u0395\u03c0\u03b9\u03bb\u03bf\u03b3\u03ad\u03c2",
      optionsTitle: "\u0395\u03c0\u03b9\u03bb\u03bf\u03b3\u03ad\u03c2 \u03b3\u03b9\u03b1",
      containsLabel: "\u03a0\u03b5\u03c1\u03b9\u03ad\u03c7\u03b5\u03b9",
      includedLabel: "\u03a0\u03b5\u03c1\u03b9\u03bb\u03b1\u03bc\u03b2\u03ac\u03bd\u03b5\u03c4\u03b1\u03b9",
      emptyState: "\u0394\u03b5\u03bd \u03b2\u03c1\u03ad\u03b8\u03b7\u03ba\u03b1\u03bd \u03b5\u03af\u03b4\u03b7.",
      loading: "\u03a6\u03cc\u03c1\u03c4\u03c9\u03c3\u03b7...",
      error: "\u0391\u03c0\u03bf\u03c4\u03c5\u03c7\u03af\u03b1 \u03c6\u03cc\u03c1\u03c4\u03c9\u03c3\u03b7\u03c2 \u03bc\u03b5\u03bd\u03bf\u03cd.",
      noStore: "\u0394\u03b5\u03bd \u03ad\u03c7\u03b5\u03b9 \u03b5\u03c0\u03b9\u03bb\u03b5\u03c7\u03b8\u03b5\u03af \u03ba\u03b1\u03c4\u03ac\u03c3\u03c4\u03b7\u03bc\u03b1.",
      footerNotice: "\u03a3\u03c5\u03bc\u03b2\u03bf\u03c5\u03bb\u03b5\u03c5\u03c4\u03b5\u03af\u03c4\u03b5 \u03c4\u03bf \u03c0\u03c1\u03bf\u03c3\u03c9\u03c0\u03b9\u03ba\u03cc \u03b3\u03b9\u03b1 \u03b1\u03bb\u03bb\u03b5\u03c1\u03b3\u03af\u03b5\u03c2 \u03ae \u03b5\u03b9\u03b4\u03b9\u03ba\u03ad\u03c2 \u03c0\u03c1\u03bf\u03c4\u03b9\u03bc\u03ae\u03c3\u03b5\u03b9\u03c2."
    };

    const TAG_LABELS = {
      vegetarian: { label: "\u03a7\u03bf\u03c1\u03c4\u03bf\u03c6\u03b1\u03b3\u03b9\u03ba\u03cc", className: "tag--green" },
      vegan: { label: "\u0392\u03af\u03b3\u03ba\u03b1\u03bd", className: "tag--green" },
      gluten_free: { label: "\u03a7\u03c9\u03c1\u03af\u03c2 \u0393\u03bb\u03bf\u03c5\u03c4\u03ad\u03bd\u03b7", className: "tag--blue" },
      dairy_free: { label: "\u03a7\u03c9\u03c1\u03af\u03c2 \u0393\u03b1\u03bb\u03b1\u03ba\u03c4\u03bf\u03ba\u03bf\u03bc\u03b9\u03ba\u03ac", className: "tag--blue" },
      spicy: { label: "\u03a0\u03b9\u03ba\u03ac\u03bd\u03c4\u03b9\u03ba\u03bf", className: "tag--red" }
    };

    const ALLERGEN_LABELS = {
      nuts: { label: "\u039e\u03b7\u03c1\u03bf\u03af \u03ba\u03b1\u03c1\u03c0\u03bf\u03af" },
      dairy: { label: "\u0393\u03b1\u03bb\u03b1\u03ba\u03c4\u03bf\u03ba\u03bf\u03bc\u03b9\u03ba\u03ac" },
      gluten: { label: "\u0393\u03bb\u03bf\u03c5\u03c4\u03ad\u03bd\u03b7" },
      seafood: { label: "\u0398\u03b1\u03bb\u03b1\u03c3\u03c3\u03b9\u03bd\u03ac" },
      eggs: { label: "\u0391\u03b2\u03b3\u03ac" },
      soy: { label: "\u03a3\u03cc\u03b3\u03b9\u03b1" }
    };

    const state = {
      menu: null,
      slug: ""
    };

    const dom = {
      restaurantName: document.getElementById("restaurantName"),
      menuBadge: document.getElementById("menuBadge"),
      categoryNav: document.getElementById("categoryNav"),
      statusMessage: document.getElementById("statusMessage"),
      menuContent: document.getElementById("menuContent"),
      footerNotice: document.getElementById("footerNotice"),
      optionsModal: document.getElementById("optionsModal"),
      optionsTitle: document.getElementById("optionsTitle"),
      optionsList: document.getElementById("optionsList"),
      optionsClose: document.getElementById("optionsClose")
    };
    function t(key) {
      return COPY[key] || key;
    }

    function formatCategoryLabel(label) {
      if (!label) return "";
      return label.replace(/^\d+\./, "").replace(/_/g, " ").trim();
    }

    function getItemName(item) {
      return item.name || "";
    }

    function getItemDescription(item) {
      return item.description || "";
    }

    function getSlugFromPath() {
      const path = location.pathname.replace(/\/+$/, "");
      if (path.startsWith("/s/")) return path.slice(3).replace(/^\//, "").toLowerCase();
      const params = new URLSearchParams(window.location.search);
      const slugParam = params.get("slug");
      if (slugParam) return slugParam.trim().toLowerCase();
      return "pospal";
    }

    function setStatus(message) {
      dom.statusMessage.textContent = message;
    }

    function centerCategoryButton(button) {
      if (!button || !dom.categoryNav || dom.categoryNav.offsetParent === null) return;
      if (dom.categoryNav.scrollWidth <= dom.categoryNav.clientWidth) return;
      const navRect = dom.categoryNav.getBoundingClientRect();
      const btnRect = button.getBoundingClientRect();
      const delta = (btnRect.left + btnRect.width / 2) - (navRect.left + navRect.width / 2);
      dom.categoryNav.scrollTo({ left: dom.categoryNav.scrollLeft + delta, behavior: "smooth" });
    }

    function keepCategoryButtonVisible(button) {
      if (!button || !dom.categoryNav || dom.categoryNav.offsetParent === null) return;
      if (dom.categoryNav.scrollWidth <= dom.categoryNav.clientWidth) return;
      const navRect = dom.categoryNav.getBoundingClientRect();
      const btnRect = button.getBoundingClientRect();
      const padding = 12;
      if (btnRect.left < navRect.left + padding) {
        dom.categoryNav.scrollBy({ left: btnRect.left - navRect.left - padding, behavior: "smooth" });
      } else if (btnRect.right > navRect.right - padding) {
        dom.categoryNav.scrollBy({ left: btnRect.right - navRect.right + padding, behavior: "smooth" });
      }
    }

    function scrollToCategorySection(section) {
      if (!section) return;
      const navHeight = dom.categoryNav ? dom.categoryNav.offsetHeight : 0;
      const offset = navHeight + 12;
      const targetTop = Math.max(section.getBoundingClientRect().top + window.scrollY - offset, 0);
      window.scrollTo({ top: targetTop, behavior: "smooth" });
    }

    function renderCategoryNav(categories) {
      dom.categoryNav.innerHTML = "";
      if (categories.length <= 1) {
        dom.categoryNav.style.display = "none";
        return;
      }
      dom.categoryNav.style.display = "flex";
      categories.forEach((category, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "category-btn";
        btn.textContent = formatCategoryLabel(category);
        btn.dataset.category = category;
        if (index === 0) btn.classList.add("active");
        btn.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          const target = document.querySelector(`[data-category-section="${category}"]`);
          if (target) {
            scrollToCategorySection(target);
          }
          centerCategoryButton(btn);
          btn.blur();
        });
        dom.categoryNav.appendChild(btn);
      });
    }

    function renderItems(menu) {
      dom.menuContent.innerHTML = "";
      const fragment = document.createDocumentFragment();
      const categories = Object.keys(menu || {});

      if (!categories.length) {
        setStatus(t("emptyState"));
        return;
      }

      setStatus("");
      renderCategoryNav(categories);

      categories.forEach((category, catIndex) => {
        const section = document.createElement("section");
        section.className = "category reveal";
        section.dataset.categorySection = category;
        section.style.transitionDelay = `${catIndex * 50}ms`;

        const heading = document.createElement("h2");
        heading.textContent = formatCategoryLabel(category);
        const line = document.createElement("div");
        line.className = "category-line";
        section.appendChild(heading);
        section.appendChild(line);

        (menu[category] || []).forEach(item => {
          const card = document.createElement("article");
          card.className = "item-card";

          const header = document.createElement("div");
          header.className = "item-header";

          const name = document.createElement("h3");
          name.className = "item-name";
          name.textContent = getItemName(item);

          const price = document.createElement("div");
          price.className = "price-pill";
          price.textContent = `${EURO}${Number(item.price || 0).toFixed(2)}`;

          header.appendChild(name);
          header.appendChild(price);
          card.appendChild(header);

          const descriptionText = getItemDescription(item);
          if (descriptionText) {
            const description = document.createElement("p");
            description.className = "description";
            description.textContent = descriptionText;
            card.appendChild(description);
          }

          const metaRow = document.createElement("div");
          metaRow.className = "meta-row";

          const tags = Array.isArray(item.dietary_tags) ? item.dietary_tags : [];
          const tagOrder = ["spicy", "vegan", "vegetarian", "gluten_free", "dairy_free"];
          tagOrder.forEach(tag => {
            if (!tags.includes(tag)) return;
            const tagData = TAG_LABELS[tag];
            if (!tagData) return;
            const chip = document.createElement("span");
            chip.className = `tag ${tagData.className}`;
            chip.textContent = tagData.label;
            metaRow.appendChild(chip);
          });

          if (metaRow.children.length) {
            card.appendChild(metaRow);
          }

          const hasOptions = item.hasGeneralOptions && Array.isArray(item.generalOptions) && item.generalOptions.length > 0;
          if (hasOptions) {
            const optionsBtn = document.createElement("button");
            optionsBtn.type = "button";
            optionsBtn.className = "options-btn";
            optionsBtn.textContent = t("optionsLabel");
            optionsBtn.addEventListener("click", () => openOptionsModal(item));
            card.appendChild(optionsBtn);
          }

          const allergens = Array.isArray(item.allergens) ? item.allergens : [];
          if (allergens.length) {
            const allergen = document.createElement("div");
            allergen.className = "allergen-warning";
            const allergenText = allergens
              .map(name => (ALLERGEN_LABELS[name] ? ALLERGEN_LABELS[name].label : name))
              .join(", ");
            allergen.textContent = `${t("containsLabel")}: ${allergenText}`;
            card.appendChild(allergen);
          }

          section.appendChild(card);
        });

        fragment.appendChild(section);
      });

      dom.menuContent.appendChild(fragment);
      requestAnimationFrame(() => document.body.classList.add("ready"));
      bindScrollSpy();
    }
    function bindScrollSpy() {
      const sections = Array.from(document.querySelectorAll("[data-category-section]"));
      if (!sections.length) return;

      const buttons = Array.from(dom.categoryNav.querySelectorAll(".category-btn"));
      if (!buttons.length) return;
      let activeCategory = "";

      function updateActive() {
        const offset = 120;
        const scrollPosition = window.scrollY + offset;
        let active = sections[0].dataset.categorySection;
        sections.forEach(section => {
          if (section.offsetTop <= scrollPosition) {
            active = section.dataset.categorySection;
          }
        });

        if (active === activeCategory) return;
        activeCategory = active;
        let activeButton = null;
        buttons.forEach(btn => {
          const isActive = btn.dataset.category === active;
          btn.classList.toggle("active", isActive);
          if (isActive) activeButton = btn;
        });
        keepCategoryButtonVisible(activeButton);
      }

      window.removeEventListener("scroll", updateActive);
      window.addEventListener("scroll", updateActive, { passive: true });
      updateActive();
    }

    function openOptionsModal(item) {
      dom.optionsTitle.textContent = `${t("optionsTitle")} ${getItemName(item)}`;
      dom.optionsList.innerHTML = "";

      (item.generalOptions || []).forEach(option => {
        const row = document.createElement("div");
        row.className = "option-row";

        const name = document.createElement("span");
        name.textContent = option.name;

        const price = document.createElement("span");
        const value = Number(option.price || option.priceChange || 0);
        price.className = "option-price";
        if (value < 0) price.classList.add("negative");
        price.textContent = value === 0
          ? `+${EURO}0.00`
          : `${value > 0 ? "+" : ""}${EURO}${Math.abs(value).toFixed(2)}`;

        row.appendChild(name);
        row.appendChild(price);
        dom.optionsList.appendChild(row);
      });

      dom.optionsModal.classList.add("show");
      dom.optionsModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeOptionsModal() {
      dom.optionsModal.classList.remove("show");
      dom.optionsModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function applyFilters() {
      if (!state.menu) return;
      renderItems(state.menu);
    }

    async function loadMenu() {
      state.slug = getSlugFromPath();
      dom.restaurantName.textContent = state.slug ? formatCategoryLabel(state.slug.replace(/-/g, " ")) : t("menuTitle");
      document.title = state.slug ? `${t("menuTitle")} - ${state.slug}` : t("menuTitle");

      if (!state.slug) {
        setStatus(t("noStore"));
        return;
      }

      setStatus(t("loading"));

      try {
        const res = await fetch(`${API_BASE}/v1/stores/${encodeURIComponent(state.slug)}/menu`, { cache: "default" });
        if (!res.ok) {
          setStatus(res.status === 404 ? t("error") : t("error"));
          return;
        }
        state.menu = await res.json();
        applyFilters();
      } catch (err) {
        setStatus(t("error"));
      }
    }

    dom.optionsClose.addEventListener("click", closeOptionsModal);
    dom.optionsModal.addEventListener("click", event => {
      if (event.target === dom.optionsModal) closeOptionsModal();
    });

    document.documentElement.lang = "el";
    dom.menuBadge.textContent = t("menuTitle");
    dom.footerNotice.textContent = t("footerNotice");
    loadMenu();
  </script>
</body>
</html>
